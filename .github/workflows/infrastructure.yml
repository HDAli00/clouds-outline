name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infrastructure/**"
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to target"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      action:
        description: "Action to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

permissions:
  id-token: write   # Required for OIDC
  contents: read
  pull-requests: write  # Required to post plan output as PR comment

env:
  TERRAGRUNT_VERSION: "0.67.16"
  TERRAFORM_VERSION: "1.11.4"
  AWS_REGION: "eu-west-1"

# ──────────────────────────────────────────────────────────────────────────────
# Reusable setup steps extracted via a composite-style run sequence.
# Each job installs Terraform + Terragrunt and configures AWS via OIDC.
# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # STAGING — Plan then Apply on every PR run.
  # Staging is a live preview environment; changes apply immediately so the
  # branch is always tested against real AWS before merging.
  # ────────────────────────────────────────────────────────────────────────────
  plan-staging:
    name: Plan / Staging
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    outputs:
      plan-exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt plan — staging
        id: plan
        working-directory: infrastructure/environments/staging
        run: |
          terragrunt run-all plan \
            --terragrunt-non-interactive \
            --terragrunt-include-external-dependencies \
            --terragrunt-exclude-dir acm \
            --terragrunt-exclude-dir cloudfront \
            --terragrunt-exclude-dir route53 \
            -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-plan
          path: infrastructure/environments/staging/plan-output.txt

      - name: Post plan comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/environments/staging/plan-output.txt', 'utf8');

            // Extract summary line e.g. "Plan: 4 to add, 1 to change, 0 to destroy."
            const summaryMatch = plan.match(/Plan: .+/);
            const summary = summaryMatch ? summaryMatch[0] : 'No changes.';

            // Extract individual resource action lines (+ add, ~ update, - destroy, -/+ replace)
            const resourceLines = [...plan.matchAll(/^\s+[#] (.+) will be (created|updated|destroyed|replaced)/gm)]
              .map(m => {
                const action = m[2] === 'created' ? '+ create' : m[2] === 'destroyed' ? '- destroy' : m[2] === 'replaced' ? '-/+ replace' : '~ update';
                return `  ${action}: \`${m[1]}\``;
              });

            const resourceList = resourceLines.length > 0
              ? resourceLines.join('\n')
              : '  No resource changes.';

            const body = `## Staging Plan\n**${summary}**\n\n${resourceList}\n\n> Full plan saved as workflow artifact \`staging-plan\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply-staging:
    name: Apply / Staging
    needs: plan-staging
    if: |
      always() &&
      needs.plan-staging.result == 'success' &&
      (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging' && inputs.action == 'apply'))
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: terraform-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt apply — staging
        working-directory: infrastructure/environments/staging
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --terragrunt-include-external-dependencies \
            --terragrunt-exclude-dir acm \
            --terragrunt-exclude-dir cloudfront \
            --terragrunt-exclude-dir route53

  # ────────────────────────────────────────────────────────────────────────────
  # PRODUCTION — Plan on every PR (diff preview only, no apply).
  # Apply only on merge to main, gated behind manual approval.
  # Configure a GitHub Environment named "production" with required reviewers
  # in repo Settings → Environments to enforce the approval gate.
  # ────────────────────────────────────────────────────────────────────────────
  plan-production:
    name: Plan / Production
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt plan — production
        id: plan
        working-directory: infrastructure/environments/production
        run: |
          terragrunt run-all plan \
            --terragrunt-non-interactive \
            --terragrunt-include-external-dependencies \
            --terragrunt-exclude-dir acm \
            --terragrunt-exclude-dir cloudfront \
            --terragrunt-exclude-dir route53 \
            -no-color 2>&1 | tee plan-output.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload plan output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-plan
          path: infrastructure/environments/production/plan-output.txt

      - name: Post plan comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/environments/production/plan-output.txt', 'utf8');

            const summaryMatch = plan.match(/Plan: .+/);
            const summary = summaryMatch ? summaryMatch[0] : 'No changes.';

            const resourceLines = [...plan.matchAll(/^\s+[#] (.+) will be (created|updated|destroyed|replaced)/gm)]
              .map(m => {
                const action = m[2] === 'created' ? '+ create' : m[2] === 'destroyed' ? '- destroy' : m[2] === 'replaced' ? '-/+ replace' : '~ update';
                return `  ${action}: \`${m[1]}\``;
              });

            const resourceList = resourceLines.length > 0
              ? resourceLines.join('\n')
              : '  No resource changes.';

            const body = `## Production Plan *(apply will run after merge)*\n**${summary}**\n\n${resourceList}\n\n> Full plan saved as workflow artifact \`production-plan\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  apply-production:
    name: Apply / Production
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    environment: production          # ← pauses here until a reviewer approves
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terragrunt apply — production
        working-directory: infrastructure/environments/production
        run: |
          terragrunt run-all apply \
            --terragrunt-non-interactive \
            --terragrunt-include-external-dependencies \
            --terragrunt-exclude-dir acm \
            --terragrunt-exclude-dir cloudfront \
            --terragrunt-exclude-dir route53
