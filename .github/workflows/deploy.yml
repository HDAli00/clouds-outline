name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "infrastructure/**"
      - ".github/workflows/infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: "Image SHA tag to deploy (for rollback, e.g. sha-a1b2c3). Leave blank for latest build."
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-1
  AWS_ACCOUNT_ID: "004947744285"
  STAGING_REPO: outline-staging
  PRODUCTION_REPO: outline-production

# ──────────────────────────────────────────────────────────────────────────────
# Build once — push versioned image to staging ECR only.
# Production always promotes the exact same image from staging; never rebuilds.
# Skipped on manual rollback (image_tag is provided).
# ──────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    name: Build & Push to Staging ECR
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.STAGING_REPO }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push base image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.STAGING_REPO }}:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Build and push app image to staging ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: BASE_IMAGE=${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.STAGING_REPO }}:base
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy staging
  # Terraform owns the task definitions (secrets, env vars, health check config).
  # This job just pushes :latest to ECR and forces a new deployment so ECS
  # re-pulls the image. No task-def registration needed.
  # On rollback: retag an old sha-xxx as :latest, then force deploy.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy / Staging
    needs: build
    if: |
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'))
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.image-tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify image exists in staging ECR
        run: |
          aws ecr describe-images \
            --repository-name ${{ env.STAGING_REPO }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --query 'imageDetails[0].imageTags' \
            --output text

      - name: Retag image as :latest (for rollback dispatches)
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.STAGING_REPO }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --query 'images[0].imageManifest' \
            --output text)
          aws ecr put-image \
            --repository-name ${{ env.STAGING_REPO }} \
            --image-tag latest \
            --image-manifest "$MANIFEST" || true

      - name: Force new deployment — web
        run: |
          aws ecs update-service \
            --cluster outline-staging \
            --service outline-staging-web \
            --force-new-deployment

      - name: Force new deployment — worker
        run: |
          aws ecs update-service \
            --cluster outline-staging \
            --service outline-staging-worker \
            --force-new-deployment

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster outline-staging \
            --services outline-staging-web outline-staging-worker

      - name: Print deployed image
        run: echo "Deployed ${{ env.STAGING_REPO }}:${{ env.IMAGE_TAG }} (as :latest) to staging"

  # ──────────────────────────────────────────────────────────────────────────────
  # Deploy production
  # Copies the exact image from staging ECR into production ECR by manifest digest
  # (bit-for-bit identical — not a rebuild). Gated by GitHub Environment approval.
  # On rollback: skips the copy step if the SHA already exists in production ECR.
  # ──────────────────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy / Production
    needs: [build, deploy-staging]
    if: |
      always() &&
      needs.deploy-staging.result == 'success' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production'))
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.image-tag }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Promote image from staging ECR to production ECR
        run: |
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name ${{ env.STAGING_REPO }} \
            --image-ids imageTag=${{ env.IMAGE_TAG }} \
            --query 'images[0].imageManifest' \
            --output text)

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: Image ${{ env.IMAGE_TAG }} not found in staging ECR"
            exit 1
          fi

          # Push SHA tag (|| true — non-fatal if already exists, e.g. on rollback)
          aws ecr put-image \
            --repository-name ${{ env.PRODUCTION_REPO }} \
            --image-tag ${{ env.IMAGE_TAG }} \
            --image-manifest "$MANIFEST" || true

          # Always update :latest pointer in production ECR
          aws ecr put-image \
            --repository-name ${{ env.PRODUCTION_REPO }} \
            --image-tag latest \
            --image-manifest "$MANIFEST" || true

      - name: Force new deployment — web
        run: |
          aws ecs update-service \
            --cluster outline-production \
            --service outline-production-web \
            --force-new-deployment

      - name: Force new deployment — worker
        run: |
          aws ecs update-service \
            --cluster outline-production \
            --service outline-production-worker \
            --force-new-deployment

      - name: Wait for services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster outline-production \
            --services outline-production-web outline-production-worker

      - name: Print deployed image
        run: echo "Deployed ${{ env.PRODUCTION_REPO }}:${{ env.IMAGE_TAG }} to production"
